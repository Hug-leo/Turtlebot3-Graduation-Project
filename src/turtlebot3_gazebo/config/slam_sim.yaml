# Simulation-specific SLAM Toolbox parameters.
# The real-robot file stays in slam_handheld.yaml; this file assumes Gazebo
# publishes /scan, /odom, /tf, and /clock.
slam_toolbox:
  ros__parameters:
    use_sim_time: true

    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan

    mode: mapping
    resolution: 0.05
    map_update_interval: 1.0
    minimum_time_interval: 0.2
    transform_publish_period: 0.05

    throttle_scans: 1
    scan_queue_size: 50
    tf_buffer_duration: 30.0
    transform_timeout: 0.5

    use_scan_matching: true
